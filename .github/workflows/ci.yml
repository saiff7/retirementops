name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Secret hygiene (tracked files)
        run: python3 scripts/check_no_secrets.py

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install (locked)
        run: uv sync --locked

      - name: Generate throwaway CI secrets and dev keys
        run: uv run python scripts/dev_bootstrap.py

      - name: Start Postgres 16 (same compose file as local dev)
        run: docker compose up -d --wait db

      - name: Lint and format
        run: |
          uv run ruff check src tests scripts migrations
          uv run ruff format --check src tests scripts migrations

      - name: Types
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Golden dataset matches its builder (M4)
        run: uv run python scripts/build_golden.py --check

      - name: Tests (unit, integration, security, evals)
        run: uv run pytest -q

      # M4 safety tier (ADR-010): ScriptedProvider only, against a freshly provisioned
      # retirementops_eval. Exits 1 if any safety gate fails, which fails this job.
      # Reports stay on the runner (no upload).
      - name: Safety evaluation gates (blocking)
        run: uv run python scripts/run_eval.py --tier safety --out "$RUNNER_TEMP/eval-reports"
