# Local development database only. Synthetic data. Bound to localhost.
# Secrets come from .env (generated by `uv run python scripts/dev_bootstrap.py`, git-ignored).
services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run scripts/dev_bootstrap.py first}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${RO_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
